<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Travel Recommendation</title>
    <link rel="stylesheet" href="travel_recommendation.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <nav>
      <h1>Travel Recommendation</h1>
      <ul>
        <li><a href="./index.html" id="home">Home </a></li>
        <li><a href="./about_us.html" id="about_us">About Us </a></li>
        <li><a href="./contact.html" id="contact">Contact Us </a></li>
        <li>
          <input
            type="text"
            id="conditionInput"
            placeholder="Search for a destination"
          />
        </li>
        <li><button id="btnSearch">Search</button></li>
        <li><button id="btnReset">Reset</button></li>
      </ul>
    </nav>

    <main class="hero">
      <div class="contact-content">
        <h1 class="contact-title">CONTACT US</h1>
        <p class="contact-subtitle">Get in touch</p>

        <form class="contact-form">
          <div class="form-group">
            <label for="name">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="your name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="your email"
              required
            />
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea
              id="message"
              name="message"
              placeholder="your message"
              required
            ></textarea>
          </div>

          <button type="submit" class="submit-btn">Submit</button>
        </form>
      </div>

      <div class="social-links">
        <a href="#" class="social-link"><i class="fab fa-twitter"></i></a>
        <a href="#" class="social-link"><i class="fab fa-facebook-f"></i></a>
        <a href="#" class="social-link"><i class="fab fa-instagram"></i></a>
        <a href="#" class="social-link"><i class="fab fa-youtube"></i></a>
      </div>
    </main>

    <script src="travel_recommendation.js"></script>
  </body>
</html>
